[package]
name = "state-capture"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Drain SQLite _outbox files into a spool; apply spool JSONL into local Postgres"
repository = "https://github.com/alexwoolford/state-capture-collector"
rust-version = "1.80"

[[bin]]
name = "state-capture"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
postgres = { version = "0.19", features = ["with-serde_json-1"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
